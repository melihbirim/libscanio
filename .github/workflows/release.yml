name: Release

on:
  workflow_dispatch:
    inputs:
      npm_only_tag:
        description: 'Retry npm from an existing release tag; blank builds only'
        required: false
        default: ''
        type: string
  release:
    types: [published]
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/check_release.py'
      - 'scripts/test_check_release.py'

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test_check_release.py
      - name: Match release tag to package versions
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.npm_only_tag }}
        run: python scripts/check_release.py

  packages:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.npm_only_tag == '')
    needs: validate
    uses: ./.github/workflows/packages.yml

  build:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.npm_only_tag == '')
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-linux-gnu
            libdir: lib
            libname: libscanio.so
            asset: libscanio-linux-x86_64.so
          - target: aarch64-linux-gnu
            libdir: lib
            libname: libscanio.so
            asset: libscanio-linux-aarch64.so
          - target: x86_64-macos
            libdir: lib
            libname: libscanio.dylib
            asset: libscanio-macos-x86_64.dylib
          - target: aarch64-macos
            libdir: lib
            libname: libscanio.dylib
            asset: libscanio-macos-aarch64.dylib
          - target: x86_64-windows-gnu
            # The loadable .dll lands in zig-out/bin on Windows, not
            # zig-out/lib (which only gets the .lib import stub) —
            # verified by actually cross-compiling this target locally
            # before trusting the workflow, not assumed.
            libdir: bin
            libname: scanio.dll
            asset: libscanio-windows-x86_64.dll
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      # Cross-compiled from Linux for every target above — Zig ships its
      # own bundled libc/linker for each, no native macOS/Windows machine
      # needed to BUILD (only to RUN/verify, which ci.yml's matrix does
      # separately against real runners).
      - name: Build c-lib for ${{ matrix.target }}
        run: zig build c-lib -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Rename artifact
        run: cp zig-out/${{ matrix.libdir }}/${{ matrix.libname }} ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: c-${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: github.event_name == 'release'
    permissions:
      contents: write
    needs: [build, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: c-*
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: artifacts/wheels
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts/npm
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true

  publish-pypi:
    if: github.event_name == 'release'
    needs: [validate, packages, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-npm:
    if: >-
      always() && needs.validate.result == 'success' &&
      ((github.event_name == 'release' && needs.packages.result == 'success' && needs.build.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.npm_only_tag != ''))
    needs: [validate, packages, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        if: github.event_name == 'release'
        with:
          name: npm-package
          path: dist
      - name: Download existing release tarball for npm retry
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.npm_only_tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern "libscanio-$VERSION.tgz" --dir dist
          tar -xOf "dist/libscanio-$VERSION.tgz" package/package.json > package-metadata.json
          node -e 'const p=require("./package-metadata.json"); if(p.name!=="libscanio" || p.version!==process.env.VERSION) throw Error("Release package version mismatch")'
      - name: Publish tested tarball with provenance
        run: npm publish ./dist/*.tgz --access public --provenance
