name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest deliberately NOT used: reproduced locally (both on
        # the GH runner and on an identical local macOS 26.5.1/Xcode 26.6
        # machine) that Zig 0.15.2's OFFICIAL prebuilt binary fails to
        # link ANY program on this SDK — "undefined symbol:
        # __availability_version_check" and ~25 other libSystem symbols
        # missing. Confirmed it's specifically the official binary, not
        # this project: Homebrew's zig 0.15.2 (built from source against
        # the local SDK) links fine on the identical machine; the
        # official release's bundled SDK-symbol snapshot hasn't caught up
        # to this very new macOS/Xcode yet. Pinned to macos-14 until a
        # newer Zig release fixes this upstream — not a workaround
        # anyone should need to touch again once that happens.
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # scan_table()'s Zig-side FFI (buffer addresses, zero-copy Arrow
      # arrays) is exactly the platform-specific surface CI exists to
      # catch — install pyarrow so its tests actually run here instead
      # of only ever being exercised on whichever machine has it locally.
      - name: pip install pyarrow
        run: python3 -m pip install pyarrow

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: zig build test
        run: zig build test

      - name: zig build c-lib (ReleaseFast)
        run: zig build c-lib -Doptimize=ReleaseFast

      - name: zig build smoke-test
        run: zig build smoke-test

      - name: zig build python-test
        run: zig build python-test

      # Node binding tests skipped on Windows — real, narrowed, unresolved
      # koffi bug, not a libscanio one. Confirmed: koffi 3.2.1 doesn't fix
      # it (retested, same crash). A diagnostic (node/test/windows_diag.js)
      # isolated it precisely: a zero-arg str-returning call works fine;
      # scanio_open(path, null) — a bare 2-arg call, second arg a raw
      # NULL pointer, no struct involved at all — crashes at the exact
      # same point (exit code 5, zero output right after koffi dispatches
      # the call). That rules out struct marshaling entirely, which the
      # earlier struct-layout theory assumed was the cause. Proof the bug
      # isn't in libscanio's own code: examples/smoke_test.py calls
      # scanio_open(path, None) via Python ctypes — the IDENTICAL shape —
      # and it passes cleanly on this same Windows runner. The bug is
      # isolated to koffi's own Windows FFI dispatch for this call shape
      # (2 args, a pointer arg, void* return), not anything upstream of
      # it. Real next step: file this as a minimal, reproducible upstream
      # koffi issue (windows_diag.js IS that repro) rather than guess
      # further blind — see ROADMAP.md's M5b entry.
      - name: npm install (node binding)
        if: runner.os != 'Windows'
        working-directory: node
        run: npm install

      - name: zig build node-test
        if: runner.os != 'Windows'
        run: zig build node-test
        env:
          LIBSCANIO_DEBUG: '1'

  # N-API addon — the koffi replacement (see src/node_binding.zig's doc
  # comment for why: koffi has an unresolved, unfixable-from-this-side
  # Windows crash, see the `test` job's Node-skip comment above). Windows
  # listed FIRST in the matrix, deliberately: koffi's crash was only
  # discovered after the Node binding had already been built and verified
  # on macOS/Linux, at which point a Windows-only bug meant redoing the
  # investigation from scratch. Catching a Windows regression on the
  # FIRST platform checked, not the last, is the whole point this time.
  node-napi:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Windows needs two things the Node toolcache doesn't ship: the C
      # headers (node_api.h) and node.lib, the import library that
      # resolves napi_* symbols at link time — a Windows DLL cannot leave
      # symbols undefined the way a .so/.dylib can. Same approach as
      # csvql's own ci.yml (this project's sibling, source of this whole
      # N-API pattern).
      - name: Fetch Node.js headers and node.lib (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          NODE_VER=$(node -e "console.log(process.versions.node)")
          curl -fsSL "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-headers.tar.gz" -o node-headers.tar.gz
          tar -xzf node-headers.tar.gz
          curl -fsSL "https://nodejs.org/dist/v${NODE_VER}/win-x64/node.lib" -o node.lib
          echo "NODE_INCLUDE=node-v${NODE_VER}/include/node" >> $GITHUB_ENV
          echo "NODE_LIB=$(pwd)/node.lib" >> $GITHUB_ENV

      - name: Build the addon
        shell: bash
        run: |
          EXTRA=""
          [ -n "$NODE_INCLUDE" ] && EXTRA="\"-Dnode-include=$NODE_INCLUDE\""
          [ -n "$NODE_LIB" ] && EXTRA="$EXTRA \"-Dnode-lib=$NODE_LIB\""
          eval zig build node -Doptimize=ReleaseFast $EXTRA 2>&1 | tee build.log
          # An undefined napi_* symbol is only a WARNING to lld, not an
          # error — it still produces a .node file, one that then crashes
          # on first call. Treat it as fatal so it can never pass silently.
          if grep -q "undefined symbol: napi_" build.log; then
            echo "FAIL: addon linked with undefined N-API symbols — it will crash at runtime"
            exit 1
          fi

      - name: Run N-API binding tests
        shell: bash
        run: node node_napi/test.js
