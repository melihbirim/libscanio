name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest deliberately NOT used: reproduced locally (both on
        # the GH runner and on an identical local macOS 26.5.1/Xcode 26.6
        # machine) that Zig 0.15.2's OFFICIAL prebuilt binary fails to
        # link ANY program on this SDK — "undefined symbol:
        # __availability_version_check" and ~25 other libSystem symbols
        # missing. Confirmed it's specifically the official binary, not
        # this project: Homebrew's zig 0.15.2 (built from source against
        # the local SDK) links fine on the identical machine; the
        # official release's bundled SDK-symbol snapshot hasn't caught up
        # to this very new macOS/Xcode yet. Pinned to macos-14 until a
        # newer Zig release fixes this upstream — not a workaround
        # anyone should need to touch again once that happens.
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: zig build test
        run: zig build test

      - name: zig build c-lib (ReleaseFast)
        run: zig build c-lib -Doptimize=ReleaseFast

      - name: zig build smoke-test
        run: zig build smoke-test

      - name: zig build python-test
        run: zig build python-test

      - name: npm install (node binding)
        working-directory: node
        run: npm install

      - name: zig build node-test
        run: zig build node-test
        env:
          # Windows-only node-test failure hit here with zero output and
          # exit code 5 (no JS stack trace at all — looks like a native
          # crash inside koffi's own FFI engine, not a normal JS
          # exception). Turned on for every platform, not just Windows —
          # cheap, and this is exactly the kind of failure that needs the
          # log from the run that actually reproduces it, not a guess.
          LIBSCANIO_DEBUG: '1'
