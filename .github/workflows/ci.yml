name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest deliberately NOT used: reproduced locally (both on
        # the GH runner and on an identical local macOS 26.5.1/Xcode 26.6
        # machine) that Zig 0.15.2's OFFICIAL prebuilt binary fails to
        # link ANY program on this SDK — "undefined symbol:
        # __availability_version_check" and ~25 other libSystem symbols
        # missing. Confirmed it's specifically the official binary, not
        # this project: Homebrew's zig 0.15.2 (built from source against
        # the local SDK) links fine on the identical machine; the
        # official release's bundled SDK-symbol snapshot hasn't caught up
        # to this very new macOS/Xcode yet. Pinned to macos-14 until a
        # newer Zig release fixes this upstream — not a workaround
        # anyone should need to touch again once that happens.
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: pip install setuptools wheel
        run: python3 -m pip install setuptools wheel

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: zig build test
        run: zig build test

      - name: zig build c-lib (ReleaseFast)
        run: zig build c-lib -Doptimize=ReleaseFast

      - name: zig build smoke-test
        run: zig build smoke-test

      - name: zig build python-test
        run: zig build python-test

      - name: Build and test installed Python wheel
        run: python python/tests/test_wheel.py

      # Node binding tested in the separate node-napi job below, not here
      # — it needs Windows-specific setup (node.lib fetch) that job
      # already has, and duplicating it here would just be two copies of
      # the same setup.

  # N-API addon — see src/node_binding.zig's doc comment and ROADMAP.md's
  # M5b entry for the design history. Windows listed FIRST in the matrix,
  # deliberately: a past Node-binding bug on this project was only
  # discovered after being built and verified on macOS/Linux first, at
  # which point a Windows-only issue meant redoing the investigation from
  # scratch. Catching a Windows regression on the FIRST platform checked,
  # not the last, is the whole point this time.
  node-napi:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Windows needs two things the Node toolcache doesn't ship: the C
      # headers (node_api.h) and node.lib, the import library that
      # resolves napi_* symbols at link time — a Windows DLL cannot leave
      # symbols undefined the way a .so/.dylib can. Same approach as
      # csvql's own ci.yml (this project's sibling, source of this whole
      # N-API pattern).
      - name: Fetch Node.js headers and node.lib (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          NODE_VER=$(node -e "console.log(process.versions.node)")
          curl -fsSL "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-headers.tar.gz" -o node-headers.tar.gz
          tar -xzf node-headers.tar.gz
          curl -fsSL "https://nodejs.org/dist/v${NODE_VER}/win-x64/node.lib" -o node.lib
          echo "NODE_INCLUDE=node-v${NODE_VER}/include/node" >> $GITHUB_ENV
          echo "NODE_LIB=$(pwd)/node.lib" >> $GITHUB_ENV

      - name: Build the addon
        shell: bash
        run: |
          EXTRA=""
          [ -n "$NODE_INCLUDE" ] && EXTRA="\"-Dnode-include=$NODE_INCLUDE\""
          [ -n "$NODE_LIB" ] && EXTRA="$EXTRA \"-Dnode-lib=$NODE_LIB\""
          eval zig build node -Doptimize=ReleaseFast $EXTRA 2>&1 | tee build.log
          # An undefined napi_* symbol is only a WARNING to lld, not an
          # error — it still produces a .node file, one that then crashes
          # on first call. Treat it as fatal so it can never pass silently.
          if grep -q "undefined symbol: napi_" build.log; then
            echo "FAIL: addon linked with undefined N-API symbols — it will crash at runtime"
            exit 1
          fi

      - name: Run N-API binding tests
        shell: bash
        run: |
          node node/test/addon_test.js
          node node/test/test.js

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip install setuptools wheel
        run: python3 -m pip install setuptools wheel

      - name: Batch API benchmark smoke (gate on correctness)
        shell: bash
        run: |
          zig build python-extension -Doptimize=ReleaseFast
          PY=python3; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" bench/batches.py --rows 2000 --reps 1 --json batch-results.json
          "$PY" bench/import_validation.py --rows 2000 --reps 1 --json import-results.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ matrix.os }}
          path: |
            batch-results.json
            import-results.json
          if-no-files-found: ignore

      - name: Cross-client differential test
        shell: bash
        run: |
          zig build c-lib -Doptimize=ReleaseFast
          zig build cli -Doptimize=ReleaseFast
          # Windows runners don't reliably have a "python3" alias, only
          # "python" — the same gotcha build.zig's own python_cmd exists
          # for. Hardcoding python3 here is what broke this job.
          PY=python3; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" tests/differential_test.py
