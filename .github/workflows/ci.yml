name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Real failure hit here, not hypothetical: zig build test on
      # macos-latest linked with "undefined symbol:
      # __availability_version_check" and dozens of other libSystem
      # symbols missing, even though the identical Zig version links
      # fine on a real Mac. Known class of issue — some macOS runner
      # images don't have SDKROOT pointed at a full SDK by default,
      # which Zig's linker needs. Fixed by pointing it explicitly.
      - name: Set macOS SDKROOT
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: zig build test
        run: zig build test

      - name: zig build c-lib (ReleaseFast)
        run: zig build c-lib -Doptimize=ReleaseFast

      - name: zig build smoke-test
        run: zig build smoke-test

      - name: zig build python-test
        run: zig build python-test

      - name: npm install (node binding)
        working-directory: node
        run: npm install

      - name: zig build node-test
        run: zig build node-test
