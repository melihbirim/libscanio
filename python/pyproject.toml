[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "libscanio"
version = "0.1.2"
description = "Scan huge CSV files without loading them into memory — a tiny, fast streaming scan engine"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["csv", "scan", "streaming", "fast", "embeddable"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/melihbirim/libscanio"
Repository = "https://github.com/melihbirim/libscanio"

[tool.setuptools.packages.find]
where = ["."]
include = ["libscanio*"]

[tool.setuptools.package-data]
libscanio = ["libscanio.so", "libscanio.dylib", "scanio.dll"]
